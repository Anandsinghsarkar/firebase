<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Info Bot — Admin</title>
<style>
:root{
  --bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;--border:#262626;
  --text:#f5f5f5;--muted:#8e8e8e;--accent:#ff2d55;--ok:#22c55e;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
input,button{font-family:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}

/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.login-logo{font-size:56px;text-align:center;margin-bottom:8px}
.login-title{font-size:22px;font-weight:700;text-align:center;margin:0}
.login-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:8px}
.input{width:100%;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);outline:none;transition:border-color .15s;font-size:14px}
.input:focus{border-color:var(--accent)}
.btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-weight:600;font-size:14px;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:#dc2626}
.btn.small{width:auto;padding:7px 12px;font-size:12px;border-radius:8px}
.err{color:var(--accent);font-size:13px;text-align:center;min-height:18px}

/* app */
.app{display:none}
.app.on{display:block}
.nav{position:sticky;top:0;z-index:20;background:rgba(20,20,20,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 16px;height:56px;display:flex;align-items:center;gap:22px;max-width:100%}
.nav .brand{font-weight:700;font-size:15px}
.nav .links{display:flex;gap:18px}
.nav .links a{color:var(--muted);font-size:13px}
.nav .links a.active{color:var(--text);font-weight:600}
.nav .logout{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;font-size:12px}
.nav .logout:hover{border-color:var(--accent);color:var(--accent)}

.container{max-width:1200px;margin:0 auto;padding:22px 16px}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head h1{margin:0;font-size:20px}
.head .count{font-size:12px;color:var(--muted)}
.search-form{display:flex;gap:8px;margin-left:auto}
.search-input{width:300px;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;font-size:13px}
.search-input:focus{border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--surface2);color:var(--muted);text-align:left}
th{padding:10px 12px;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td{padding:11px 12px;border-top:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:rgba(28,28,28,.5)}
td.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
td.muted{color:var(--muted)}
td.right{text-align:right}
td.num{font-weight:600;color:var(--ok)}

.empty{padding:40px;text-align:center;color:var(--muted)}
.loading{padding:40px;text-align:center;color:var(--muted)}

.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;margin-left:6px;background:rgba(255,45,85,.2);color:var(--accent);border:1px solid rgba(255,45,85,.4)}

.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.stat-value{font-size:18px;font-weight:700}
.stat-value.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.stat-value.small{font-size:13px}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.panel-title{font-size:12px;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

.mono-box{font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:10px 12px;background:var(--surface2);border-radius:8px;word-break:break-all;color:var(--muted)}

.back{color:var(--muted);font-size:13px;margin-bottom:12px;display:inline-block;cursor:pointer}
.back:hover{color:var(--text)}

.rank{font-weight:700;font-size:15px}
.rank.gold{color:#ffd700}
.rank.silver{color:#c0c0c0}
.rank.bronze{color:#cd7f32}

@media(max-width:640px){
  .search-input{width:100%}
  .search-form{width:100%;margin-left:0}
  .nav{gap:10px}
  .nav .links a{font-size:11px}
  th,td{padding:8px 8px}
  table{font-size:11px}
  .head h1{font-size:18px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
  <form id="loginForm" class="login-form">
    <div class="login-logo">🔐</div>
    <h1 class="login-title">Admin Dashboard</h1>
    <div class="login-sub">Firebase user management</div>
    <input id="key" class="input" type="password" placeholder="Admin Key" autocomplete="current-password" required autofocus/>
    <button class="btn" type="submit" id="loginBtn">Sign In</button>
    <div id="loginErr" class="err"></div>
  </form>
</div>

<!-- APP -->
<div id="app" class="app">
  <nav class="nav">
    <div class="brand">💣 Info Bot Admin</div>
    <div class="links">
      <a href="#" data-page="dashboard" class="active">👥 Users</a>
      <a href="#" data-page="top">🏆 Top Referrers</a>
    </div>
    <button id="logoutBtn" class="logout">Logout</button>
  </nav>
  <div class="container" id="pageContent"></div>
</div>

<script>
// ═══════════════════════════════════════
//   API HELPER
// ═══════════════════════════════════════
async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401) { logout(); throw new Error('Session expired'); }
    throw new Error(data.error || res.statusText);
  }
  return data;
}

// ═══════════════════════════════════════
//   LOGIN
// ═══════════════════════════════════════
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginErr');
  btn.disabled = true; btn.textContent = 'Signing in…'; err.textContent = '';
  try {
    await api('/api/login', {
      method: 'POST',
      body: JSON.stringify({ key: document.getElementById('key').value })
    });
    showApp();
  } catch (e) {
    err.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
  logout();
});

function logout() {
  document.getElementById('app').classList.remove('on');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('key').value = '';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('on');
  loadDashboard();
}

// ═══════════════════════════════════════
//   NAV
// ═══════════════════════════════════════
document.querySelectorAll('.nav .links a').forEach(a => {
  a.addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelectorAll('.nav .links a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    if (a.dataset.page === 'top') loadTop(); else loadDashboard();
  });
});

// ═══════════════════════════════════════
//   HELPERS
// ═══════════════════════════════════════
function fmtTs(ts) {
  if (!ts) return '—';
  try { return new Date(ts * 1000).toLocaleString(); } catch { return '—'; }
}
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtDate(ts) {
  if (!ts) return '—';
  try { return new Date(ts * 1000).toLocaleDateString(); } catch { return '—'; }
}

// ═══════════════════════════════════════
//   DASHBOARD — USERS LIST
// ═══════════════════════════════════════
let currentSearch = '';

async function loadDashboard() {
  const root = document.getElementById('pageContent');
  root.innerHTML = `
    <div class="head">
      <h1>Users</h1>
      <span class="count" id="userCount">loading…</span>
      <form class="search-form" id="searchForm">
        <input class="search-input" id="searchInput" placeholder="User ID / @username / referral code" value="${esc(currentSearch)}"/>
        <button class="btn small" type="submit">Search</button>
        ${currentSearch ? '<button class="btn secondary small" type="button" id="clearBtn">Clear</button>' : ''}
      </form>
    </div>
    <div class="card" id="userTable"><div class="loading">Loading…</div></div>
  `;

  document.getElementById('searchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    currentSearch = document.getElementById('searchInput').value.trim();
    loadDashboard();
  });
  const cb = document.getElementById('clearBtn');
  if (cb) cb.addEventListener('click', () => { currentSearch = ''; loadDashboard(); });

  try {
    const data = await api('/api/users?q=' + encodeURIComponent(currentSearch) + '&limit=200');
    const users = data.users || [];
    document.getElementById('userCount').textContent = users.length + ' loaded';
    renderUserTable(users);
  } catch (e) {
    document.getElementById('userTable').innerHTML = `<div class="empty" style="color:var(--accent)">${esc(e.message)}</div>`;
  }
}

function renderUserTable(users) {
  const el = document.getElementById('userTable');
  if (!users.length) { el.innerHTML = `<div class="empty">No users found</div>`; return; }
  let html = `<table><thead><tr>
    <th>User ID</th><th>Name</th><th>Username</th>
    <th style="text-align:right">Credits</th>
    <th style="text-align:right">Referrals</th>
    <th>Code</th><th>Created</th><th>Last Seen</th><th></th>
  </tr></thead><tbody>`;
  for (const u of users) {
    html += `<tr>
      <td class="mono">${u.user_id || ''}</td>
      <td>${esc(u.first_name || '—')}${u.banned ? '<span class="badge">BANNED</span>' : ''}</td>
      <td class="muted">${u.username ? '@' + esc(u.username) : '—'}</td>
      <td class="num right">${u.credits ?? 0}</td>
      <td class="right">${u.referred_count ?? 0}</td>
      <td class="mono muted">${esc(u.referral_code || '—')}</td>
      <td class="muted">${fmtDate(u.created_at)}</td>
      <td class="muted">${fmtDate(u.last_seen)}</td>
      <td><a href="#" onclick="openUser('${u.user_id}');return false;">Open →</a></td>
    </tr>`;
  }
  el.innerHTML = html + `</tbody></table>`;
}

// ═══════════════════════════════════════
//   USER DETAIL
// ═══════════════════════════════════════
window.openUser = async function (uid) {
  const root = document.getElementById('pageContent');
  root.innerHTML = `<span class="back" onclick="loadDashboard()">← Back</span><div class="loading">Loading…</div>`;
  try {
    const u = await api('/api/users/' + uid);
    renderUserDetail(u);
  } catch (e) {
    root.innerHTML = `<span class="back" onclick="loadDashboard()">← Back</span><div class="empty" style="color:var(--accent)">${esc(e.message)}</div>`;
  }
};

function renderUserDetail(u) {
  document.getElementById('pageContent').innerHTML = `
    <span class="back" onclick="loadDashboard()">← Back to Users</span>
    <div class="head"><h1>User ${u.user_id}${u.banned ? '<span class="badge">BANNED</span>' : ''}</h1></div>
    <div class="detail-grid">
      <div class="stat"><div class="stat-label">Credits</div><div class="stat-value">${u.credits ?? 0}</div></div>
      <div class="stat"><div class="stat-label">Referrals</div><div class="stat-value">${u.referred_count ?? 0}</div></div>
      <div class="stat"><div class="stat-label">Referral Code</div><div class="stat-value mono">${esc(u.referral_code || '—')}</div></div>
      <div class="stat"><div class="stat-label">Referrer ID</div><div class="stat-value mono">${u.referrer_id || '—'}</div></div>
      <div class="stat"><div class="stat-label">Created</div><div class="stat-value small">${fmtTs(u.created_at)}</div></div>
      <div class="stat"><div class="stat-label">Last Seen</div><div class="stat-value small">${fmtTs(u.last_seen)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-title">Adjust Credits</div>
      <div class="btn-row">
        <button class="btn secondary small" onclick="adjustCredits('${u.user_id}', -10)">−10</button>
        <button class="btn secondary small" onclick="adjustCredits('${u.user_id}', -1)">−1</button>
        <button class="btn secondary small" onclick="adjustCredits('${u.user_id}', 1)">+1</button>
        <button class="btn secondary small" onclick="adjustCredits('${u.user_id}', 10)">+10</button>
        <button class="btn secondary small" onclick="adjustCredits('${u.user_id}', 50)">+50</button>
        <button class="btn secondary small" onclick="setCredits('${u.user_id}', ${u.credits ?? 0})">Set…</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">Account Status</div>
      <button class="${u.banned ? 'btn' : 'btn danger'} small" onclick="toggleBan('${u.user_id}', ${!!u.banned})">
        ${u.banned ? '✅ Unban User' : '🚫 Ban User'}
      </button>
    </div>
    <div class="panel">
      <div class="panel-title">Referral Link</div>
      <div class="mono-box">${u.referral_code ? 'https://t.me/<bot_username>?start=ref_' + esc(u.referral_code) : '—'}</div>
    </div>
  `;
}

window.adjustCredits = async function (uid, delta) {
  try {
    const u = await api('/api/users/' + uid);
    const next = Math.max(0, (u.credits || 0) + delta);
    const updated = await api('/api/users/' + uid, { method: 'PATCH', body: JSON.stringify({ credits: next }) });
    renderUserDetail(updated);
  } catch (e) { alert(e.message); }
};

window.setCredits = async function (uid, current) {
  const raw = prompt('Set credits to:', String(current));
  if (raw === null) return;
  const n = parseInt(raw, 10);
  if (!Number.isFinite(n) || n < 0) return alert('Invalid number');
  try {
    const updated = await api('/api/users/' + uid, { method: 'PATCH', body: JSON.stringify({ credits: n }) });
    renderUserDetail(updated);
  } catch (e) { alert(e.message); }
};

window.toggleBan = async function (uid, banned) {
  try {
    const updated = await api('/api/users/' + uid, { method: 'PATCH', body: JSON.stringify({ banned: !banned }) });
    renderUserDetail(updated);
  } catch (e) { alert(e.message); }
};

// ═══════════════════════════════════════
//   TOP REFERRERS
// ═══════════════════════════════════════
async function loadTop() {
  const root = document.getElementById('pageContent');
  root.innerHTML = `<h1 style="font-size:20px;margin-bottom:16px">🏆 Top Referrers</h1><div class="card"><div class="loading">Loading…</div></div>`;
  try {
    const data = await api('/api/users?orderBy=referred_count&limit=100');
    const users = (data.users || []).filter(u => (u.referred_count || 0) > 0);
    if (!users.length) {
      root.innerHTML = `<h1 style="font-size:20px;margin-bottom:16px">🏆 Top Referrers</h1><div class="card"><div class="empty">No referrers yet</div></div>`;
      return;
    }
    let html = `<h1 style="font-size:20px;margin-bottom:16px">🏆 Top Referrers</h1><div class="card"><table>
      <thead><tr><th style="width:60px">Rank</th><th>User</th><th style="text-align:right">Referrals</th><th style="text-align:right">Credits</th><th>Code</th><th></th></tr></thead><tbody>`;
    users.forEach((u, i) => {
      const rank = i + 1;
      let cls = '', medal = rank + '.';
      if (rank === 1) { cls = 'gold'; medal = '🥇'; }
      else if (rank === 2) { cls = 'silver'; medal = '🥈'; }
      else if (rank === 3) { cls = 'bronze'; medal = '🥉'; }
      html += `<tr>
        <td class="rank ${cls}">${medal}</td>
        <td>${esc(u.first_name || '—')}${u.username ? ' <span class="muted">@' + esc(u.username) + '</span>' : ''}</td>
        <td class="num right">${u.referred_count}</td>
        <td class="right">${u.credits ?? 0}</td>
        <td class="mono muted">${esc(u.referral_code || '—')}</td>
        <td><a href="#" onclick="openUser('${u.user_id}');return false;">Open →</a></td>
      </tr>`;
    });
    root.innerHTML = html + `</tbody></table></div>`;
  } catch (e) {
    root.innerHTML = `<h1>🏆 Top Referrers</h1><div class="card"><div class="empty" style="color:var(--accent)">${esc(e.message)}</div></div>`;
  }
}

// ═══════════════════════════════════════
//   BOOT — try loading dashboard (cookie auth)
// ═══════════════════════════════════════
(async () => {
  try {
    await api('/api/users?limit=1');
    showApp();
  } catch {
    document.getElementById('loginScreen').style.display = 'flex';
  }
})();
</script>
</body>
</html>
